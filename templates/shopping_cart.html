{% extends "index.html" %}

{% block content %}

    <h2>Cart</h2>

    <table class="table table-striped table-hover">
      <thead>
        <tr>
          <th>#</th>
          <th>Item Name</th>
          <th>Quantity</th>
          <th></th>
          <th>Price</th>
          <th>Total</th>
        </tr>
      </thead>
      <tbody>
          {% for entry in cart_info %}
            <tr>
                <td>{{ entry[0] }}</td>
                <td>{{ entry[1] }}</td>
                <td>{{ entry[2] }}</td>
                <td>*</td>
                <td>{{ entry[3] }}</td>
                <td>{{ entry[4] }}</td>
            </tr>
          {% endfor %}

      </tbody>

    </table>
    <p><b>Total: €{{ total }}</b></p>
{% endblock %}
