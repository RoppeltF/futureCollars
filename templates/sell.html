{% extends "base.html" %}


{% block content %}

    <h2>Sale Form</h2>
    <form action="{{ url_for('app.cart') }}" method="POST">
      <div class="form-group">
        <label>Select Item:</label>
        <select class="form-select" required name="item_name">
          {% for item in item_list %}
            <option value={{ item }} >{{ item }}</option>
          {% endfor %}

        </select>
      </div>
      <div class="form-group">
        <label>Amount:</label>
        <input class="form-input" type="number" min="1" required name="amount">
      </div>
      <br><br><br>
      <button class="btn btn-primary" type="submit">Add to cart</button>
    </form>
    <br><br>
   {% if current_user.is_authenticated and current_user.is_admin %}
    <h3>Items currently with no stock: </h3>
   <hr></hr>
        <ul>
          {% for entry in items_with_no_stock %}
            <li>{{ entry }}</li>
          {% endfor %}
        </ul>
   {% endif %}


{% endblock %}
