<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>History - Accounting & Warehouse</title>
  <link rel="stylesheet" href="css/spectre.min.css">
</head>
<body>
  <header class="navbar bg-dark p-2">
    <section class="navbar-section">
      <a href="index.html" class="btn btn-link text-light">Dashboard</a>
      <a href="purchase.html" class="btn btn-link text-light">Purchase</a>
      <a href="sale.html" class="btn btn-link text-light">Sale</a>
      <a href="balance.html" class="btn btn-link text-light">Balance Change</a>
      <a href="history.html" class="btn btn-link text-light">History</a>
    </section>
  </header>

  <main class="container grid-lg p-2">
    <h2>History</h2>
    <p>
      Use <code>/history/</code> to view all history.<br>
      Use <code>/history/&lt;line_from&gt;/&lt;line_to&gt;/</code> to filter by range.
    </p>

    <table class="table table-striped table-hover">
      <thead>
        <tr>
          <th>#</th>
          <th>Operation</th>
          <th>Details</th>
          <th>Date</th>
        </tr>
      </thead>
      <tbody>
        <!--  MOCK DATA ->-->
        <tr><td>1</td><td>Purchase</td><td>Bananas × 50</td><td>2025-08-25</td></tr>
        <tr><td>2</td><td>Sale</td><td>Apples × 20</td><td>2025-08-26</td></tr>
      </tbody>
    </table>
  </main>
</body>
</html>
